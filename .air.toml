root = "."
tmp_dir = "bin/air"

[build]
  cmd = "make -B bin/gitlab-sshd"
  entrypoint = ["./bin/gitlab-sshd"]
  args_bin = ["-config-dir", "tmp/caproni"]
  include_ext = ["go"]
  include_file = ["go.mod", "go.sum"]
  exclude_dir = ["acceptance", "bin", "doc", "support", "tmp"]
  exclude_regex = ["_test.go"]
